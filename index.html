<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escuchas ONE MUSIC</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player-container">
    <div class="brand">Escuchas <span>ONE MUSIC</span></div>
    <!-- Buscador + Auto-DJ -->
    <div class="search-box">
      <span class="s-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </span>
      <input type="text" id="searchInput" placeholder="Estilo (pop, rock, 80s, 90s, latin, lofi) o link de playlist…" />
    </div>
    <button id="autoDjBtn" class="autodj-btn" title="Radio automática (pop / clásicos 80-90)">🤖 Auto-DJ</button>

    <div class="search-results" id="searchResults"></div>

    <!-- Onda de audio -->
    <div class="waveform-display">
      <svg class="waveform-svg" id="waveformSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
    </div>

    <!-- Info y favorito -->
    <div class="track-info-row">
      <button class="icon-btn" id="likeBtn" title="Favorito"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3 1 4 2 1-1 2-2 4-2 3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/></svg></button>
      <div class="track-title" id="trackTitle">Song name</div>
      <button class="icon-btn" title="Más"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
    <div id="statusText" class="status-mini">Sin búsqueda</div>

    <!-- Progreso -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"><div class="progress-knob"></div></div></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>

    <!-- Controles -->
    <div class="controls-row">
      <button class="icon-btn" id="shuffleBtn" title="Aleatorio"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h4l10 12h4"/><path d="M3 18h4l3-3.5"/><path d="M17 9l3-3h4"/><path d="M17 4l3 5-3 0"/><path d="M17 20l3-5-3 0"/></svg></button>
      <button class="icon-btn" id="prevBtn" title="Anterior"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 6v12M9 12l9 6V6z"/></svg></button>
      <button class="play-trigger" id="playBtn" title="Reproducir / Pausar">
        <span id="playIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      </button>
      <button class="icon-btn" id="nextBtn" title="Siguiente"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 6v12M15 12L4 6v12z"/></svg></button>
      <button class="icon-btn" id="repeatBtn" title="Repetir"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 2l3 3-3 3"/><path d="M3 12V9a4 4 0 014-4h13"/><path d="M7 22l-3-3 3-3"/><path d="M21 12v3a4 4 0 01-4 4H4"/></svg></button>
    </div>

    <!-- Volumen -->
    <div class="volume-container">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a3 3 0 010 6"/></svg>
      <div class="volume-slider" id="volumeSlider"><div class="volume-fill" id="volumeFill"><div class="volume-knob"></div></div></div>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 010 8"/></svg>
    </div>
  </div>

  <div id="startOverlay" class="start-overlay">
    <div class="start-card">
      <div class="start-logo">ONE <span>MUSIC</span></div>
      <p>Radio infinita desde YouTube.<br/>Toca para iniciar.</p>
      <button class="start-btn" id="startBtn">▶ Iniciar radio</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="yt-mount"></div>
  <script src="app.js"></script>
</body>
</html>
